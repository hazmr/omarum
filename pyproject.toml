[project]
name = "omarum"
version = "0.1.0"
license = "MIT"
description = "Omarum: a voice companion for Omarchy"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pipecat-ai[anthropic,google,kokoro,local,openai,piper,silero,whisper]==1.16.0",
    "pyrnnoise>=0.4.6",
]

[project.scripts]
omarum = "omarum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omarum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
